name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  decks:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the zip files to a release, for a tag
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check . && uv run ruff format --check .
      - name: The bundles are what their generators write
        run: |
          uv run python french/make_verbs.py
          uv run python physics/make_circuit_symbols.py
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Check every bundle, by importing it, and make the zip files
        run: uv run python check.py
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: dist/*.zip
      - name: Attach the zip files to a release, for a tag
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
