- slug: subjonctif
  title: 'Verbs: subjonctif présent'
  public: false
  reference: |-
    For je, tu, il and ils, the stem is the ils form of the présent without -ent (*ils
    prennent* → *prenn-*), with the endings -e, -es, -e, -ent; nous and vous are as in
    the imparfait (*nous prenions*). *Falloir* has only *qu’il faille*. The other
    irregular ones:

    | verb | que je | que nous |
    |---|---|---|
    | *être* | *sois* | *soyons* |
    | *avoir* | *aie* | *ayons* |
    | *aller* | *aille* | *allions* |
    | *faire* | *fasse* | *fassions* |
    | *pouvoir* | *puisse* | *puissions* |
    | *vouloir* | *veuille* | *voulions* |
    | *savoir* | *sache* | *sachions* |
